<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환율 계산기</title>
<style>
  :root { --bg:#f7f6f3; --card:#ffffff; --text:#37352f; --muted:#787774; --line:#e3e2e0; --accent:#2383e2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#202020; --card:#2a2a2a; --text:#e6e6e5; --muted:#9b9a97; --line:#3a3a3a; --accent:#529cca; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--text);
         font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .title { font-weight:600; }
  select, input { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line);
                  border-radius:6px; padding:6px 8px; }
  .rate { font-size:20px; font-weight:700; margin:10px 0 2px; }
  .chg { font-size:13px; font-weight:500; margin-left:8px; }
  .chg.up { color:#d44c47; }
  .chg.down { color:#2f6fed; }
  .chg.flat { color:var(--muted); }
  .sub { color:var(--muted); font-size:12px; }
  .conv { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin-top:10px; }
  .conv label { display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--muted); min-width:0; }
  .conv input { width:100%; text-align:right; }
  .arrow { color:var(--muted); padding-top:16px; }
  .foot { margin-top:10px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  a { color:var(--accent); text-decoration:none; }
  .err { color:#d44c47; }
  .manual { display:none; margin-top:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="title">💱 환율 (원화 기준)</span>
    <select id="cur" aria-label="통화 선택">
      <option value="JPY">🇯🇵 일본 엔 (JPY)</option>
      <option value="USD">🇺🇸 미국 달러 (USD)</option>
      <option value="EUR">🇪🇺 유로 (EUR)</option>
      <option value="CNY">🇨🇳 중국 위안 (CNY)</option>
      <option value="TWD">🇹🇼 대만 달러 (TWD)</option>
      <option value="HKD">🇭🇰 홍콩 달러 (HKD)</option>
      <option value="THB">🇹🇭 태국 바트 (THB)</option>
      <option value="VND">🇻🇳 베트남 동 (VND)</option>
      <option value="PHP">🇵🇭 필리핀 페소 (PHP)</option>
      <option value="SGD">🇸🇬 싱가포르 달러 (SGD)</option>
      <option value="GBP">🇬🇧 영국 파운드 (GBP)</option>
      <option value="AUD">🇦🇺 호주 달러 (AUD)</option>
    </select>
  </div>

  <div class="rate"><span id="rate">불러오는 중…</span><span class="chg" id="chg"></span></div>
  <div class="sub" id="inv"></div>

  <div class="conv">
    <label><span id="fLabel">JPY</span><input id="foreign" inputmode="decimal" value="1000"></label>
    <span class="arrow">⇄</span>
    <label>KRW (원)<input id="krw" inputmode="decimal"></label>
  </div>

  <div class="manual" id="manualBox">
    <span class="sub">환율을 불러오지 못했습니다. 직접 입력해 계산할 수 있습니다: 1 <span id="mLabel">JPY</span> = </span>
    <input id="manual" inputmode="decimal" style="width:90px"> <span class="sub">원</span>
  </div>

  <div class="foot">
    <span class="sub" id="updated"></span>
    <span class="sub">
      <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates By Exchange Rate API</a>
      · 전일 대비: <a href="https://frankfurter.dev" target="_blank" rel="noopener">Frankfurter(ECB)</a>
    </span>
  </div>
</div>

<script>
  // 100단위로 보여 주는 통화 (금액 단위가 작은 통화)
  const PER100 = { JPY: true, VND: true };
  const $ = id => document.getElementById(id);
  let rates = null;      // KRW 기준 환율 (1 KRW = rates[X] X)
  let krwPerUnit = null; // 1 X = ? KRW

  const fmt = (n, d) => n.toLocaleString('ko-KR', { maximumFractionDigits: d });
  const num = s => parseFloat(String(s).replace(/,/g, ''));

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // 전일 대비 변화량: Frankfurter(유럽중앙은행) 영업일 기준. TWD, VND는 제공되지 않음
  const ECB = new Set(['AUD','BRL','CAD','CHF','CNY','CZK','DKK','EUR','GBP','HKD','HUF','IDR','ILS','INR','ISK',
                       'JPY','MXN','MYR','NOK','NZD','PHP','PLN','RON','SEK','SGD','THB','TRY','USD','ZAR']);
  const chgCache = {};   // cur -> 'loading' | 'none' | {prev, last, prevDate, lastDate}

  function showChange(cur) {
    const el = $('chg'), c = chgCache[cur];
    el.className = 'chg'; el.title = '';
    if (!c || c === 'loading') { el.textContent = ''; return; }
    if (c === 'none') { el.className = 'chg flat'; el.textContent = '전일 대비 정보 없음'; return; }
    const unit = PER100[cur] ? 100 : 1;
    const diff = (c.last - c.prev) * unit;
    const pct = (c.last / c.prev - 1) * 100;
    el.className = 'chg ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat');
    el.textContent = (diff > 0 ? '▲ ' : diff < 0 ? '▼ ' : '- ') + fmt(Math.abs(diff), 2)
                   + ' (' + (pct > 0 ? '+' : '') + pct.toFixed(2) + '%)';
    el.title = c.prevDate + ' → ' + c.lastDate + ' (유럽중앙은행 기준)';
  }

  function loadChange(cur) {
    if (chgCache[cur]) return showChange(cur);
    if (!ECB.has(cur)) { chgCache[cur] = 'none'; return showChange(cur); }
    chgCache[cur] = 'loading';
    showChange(cur);
    const start = new Date(Date.now() - 12 * 864e5).toISOString().slice(0, 10);
    fetch('https://api.frankfurter.dev/v1/' + start + '..?base=' + cur + '&symbols=KRW')
      .then(r => r.json())
      .then(d => {
        const days = Object.keys(d.rates || {}).sort();
        if (days.length < 2) throw new Error('not enough data');
        const a = days[days.length - 2], b = days[days.length - 1];
        chgCache[cur] = { prev: d.rates[a].KRW, last: d.rates[b].KRW, prevDate: a, lastDate: b };
      })
      .catch(() => { chgCache[cur] = 'none'; })
      .then(() => { if ($('cur').value === cur) showChange(cur); });
  }

  function render() {
    const cur = $('cur').value;
    $('fLabel').textContent = cur;
    $('mLabel').textContent = cur;
    loadChange(cur);
    if (rates && rates[cur]) krwPerUnit = 1 / rates[cur];
    else if (!rates) krwPerUnit = num($('manual').value) || null;
    if (!krwPerUnit) { $('rate').textContent = '-'; $('inv').textContent = ''; $('krw').value = ''; return; }
    const unit = PER100[cur] ? 100 : 1;
    $('rate').textContent = unit + ' ' + cur + ' = ' + fmt(krwPerUnit * unit, 2) + '원';
    $('inv').textContent = '1,000원 = ' + fmt(1000 / krwPerUnit, 2) + ' ' + cur;
    fromForeign();
  }

  function fromForeign() {
    const v = num($('foreign').value);
    $('krw').value = (krwPerUnit && !isNaN(v)) ? fmt(v * krwPerUnit, 0) : '';
  }
  function fromKrw() {
    const v = num($('krw').value);
    $('foreign').value = (krwPerUnit && !isNaN(v)) ? fmt(v / krwPerUnit, 2) : '';
  }

  $('cur').addEventListener('change', () => { store('fx-cur', $('cur').value); render(); });
  $('foreign').addEventListener('input', fromForeign);
  $('krw').addEventListener('input', fromKrw);
  $('manual').addEventListener('input', render);

  const saved = load('fx-cur');
  if (saved && [...$('cur').options].some(o => o.value === saved)) $('cur').value = saved;

  fetch('https://open.er-api.com/v6/latest/KRW')
    .then(r => r.json())
    .then(d => {
      if (d.result !== 'success') throw new Error('bad result');
      rates = d.rates;
      const t = new Date(d.time_last_update_unix * 1000);
      $('updated').textContent = '기준: ' + t.toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) + ' (하루 1회 갱신)';
      render();
    })
    .catch(() => {
      $('rate').innerHTML = '<span class="err">환율을 불러오지 못했습니다</span>';
      $('manualBox').style.display = 'block';
      render();
    });
</script>
</body>
</html>
